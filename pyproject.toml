[project]
name = "slack_audit_logs-automation-module"
version = "0.1.1"
description = ""
authors = []
requires-python = ">=3.11,<4"

dependencies = [
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "requests-ratelimiter>=0.7.0",
    "sekoia-automation-sdk",
]

[build-system]
requires = ["uv_build>=0.9.7,<1.0.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.black]
line-length = 119
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 119

[tool.coverage.run]
omit = [
    "tests/*",
    "main.py",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
addopts = '''
  --strict-markers
  --tb=short
  --cov=slack_audit_logs_modules
  --cov-branch
  --cache-clear
  --cov-report=html
  --cov-report=term-missing:skip-covered
  --cov-fail-under=80
  --capture=sys
'''

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=6.1.0",
    "mypy>=1.18.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
    "types-requests>=2.32.4",
]
